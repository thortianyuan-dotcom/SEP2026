</DOCTYPE html>
<html>
<head>
<title>Paragraph Tag</title>
<link rel=icon href=sunflower.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
</head>
<body topmargin=20 leftmargin=50>
<center>
<table border=3 width=50% and height=50%>
<caption>Revision Table Tag</caption>
<tr>
<th rowspan='3'>A</th> 
<th rowspan='2'>B</th>
<th colspan='2'>C</th>
</tr>

<tr> 
<td rowspan='3'>E</td> 
<td >F</td> 
</tr>

<tr>
<td >D</td> 
<td >G</td> 
</td>

<tr> 
<td >H</td> 
<td >I</td> 
<td >J</td> 
</tr>
</center>
</table>
</body>
</html>
